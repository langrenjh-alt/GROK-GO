name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: grok_go
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d grok_go"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GROK_GO_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/grok_go?sslmode=disable
      GROK_GO_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.33.3
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - name: Frontend checks
        run: |
          pnpm --dir web lint
          pnpm --dir web test
          pnpm --dir web build
      - name: Install Playwright Chromium
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Browser checks
        run: pnpm --dir web test:e2e
      - shell: pwsh
        run: ./scripts/build-web.ps1
      - name: Go checks
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p bin
          version="${GITHUB_REF_NAME}"
          commit="${GITHUB_SHA}"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/langrenjh-alt/GROK-GO/internal/buildinfo.Version=${version} -X github.com/langrenjh-alt/GROK-GO/internal/buildinfo.Commit=${commit} -X github.com/langrenjh-alt/GROK-GO/internal/buildinfo.Date=${build_date}"
          go build -trimpath -ldflags "$ldflags" -o bin/grok-go-linux-amd64 ./cmd/grok-go
          cd bin
          sha256sum grok-go-linux-amd64 > checksums.txt
      - name: Verify single-file startup
        env:
          GROK_GO_LISTEN_ADDR: 127.0.0.1:18080
          GROK_GO_PUBLIC_URL: http://127.0.0.1:18080
          GROK_GO_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/grok_go?sslmode=disable
          GROK_GO_REDIS_URL: redis://127.0.0.1:6379/0
          GROK_GO_MASTER_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          GROK_GO_BOOTSTRAP_TOKEN: release-bootstrap-token
          GROK_GO_DATA_DIR: /tmp/grok-go-release-data
        run: |
          bin/grok-go-linux-amd64 >/tmp/grok-go-release.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:18080/readyz && break
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/readyz | grep '"status":"ready"'
          curl --fail --silent http://127.0.0.1:18080/login/ | grep '<!DOCTYPE html>'
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            bin/grok-go-linux-amd64
            bin/checksums.txt
